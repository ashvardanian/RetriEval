<svg width="1600" height="920" viewBox="0 0 1600 920" fill="none" xmlns="http://www.w3.org/2000/svg">
<title>Compare engines at equal recall.</title>
<defs>
<pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
  <path d="M0 0V6" stroke="#FFE6A7" stroke-width="2"/>
</pattern>
<pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse">
  <circle cx="3" cy="3" r="1.3" fill="#FFE6A7"/>
</pattern>
<pattern id="rows" width="6" height="6" patternUnits="userSpaceOnUse">
  <path d="M0 3H6" stroke="#FFE6A7" stroke-width="1.6"/>
</pattern>
</defs>
<rect width="1600" height="920" fill="#C44536"/>
<g id="matched-recall" font-family="Poppins, Helvetica, Arial, sans-serif" stroke-linecap="round" stroke-linejoin="round">
<text x="70" y="58" font-size="20" fill="#FFE6A7">RetriEval / search notes</text>
<text x="70" y="140" font-size="54" fill="#FFE6A7">Compare engines at equal recall.</text>
<text x="70" y="200" font-size="23" fill="#FFE6A7">Every engine trades recall for speed, so a fair comparison fixes recall first and then reads throughput.</text>
<path d="M220.0 260.0L220.0 760.0" stroke="#FFE6A7" stroke-width="1" opacity="0.2"/>
<text x="220.0" y="790.0" font-size="16" text-anchor="middle" fill="#FFE6A7" opacity="1.0" font-weight="400" font-family="Red Hat Mono, ui-monospace, monospace">0.80</text>
<path d="M450.0 260.0L450.0 760.0" stroke="#FFE6A7" stroke-width="1" opacity="0.2"/>
<text x="450.0" y="790.0" font-size="16" text-anchor="middle" fill="#FFE6A7" opacity="1.0" font-weight="400" font-family="Red Hat Mono, ui-monospace, monospace">0.85</text>
<path d="M680.0 260.0L680.0 760.0" stroke="#FFE6A7" stroke-width="1" opacity="0.2"/>
<text x="680.0" y="790.0" font-size="16" text-anchor="middle" fill="#FFE6A7" opacity="1.0" font-weight="400" font-family="Red Hat Mono, ui-monospace, monospace">0.90</text>
<path d="M910.0 260.0L910.0 760.0" stroke="#FFE6A7" stroke-width="1" opacity="0.2"/>
<text x="910.0" y="790.0" font-size="16" text-anchor="middle" fill="#FFE6A7" opacity="1.0" font-weight="400" font-family="Red Hat Mono, ui-monospace, monospace">0.95</text>
<path d="M1140.0 260.0L1140.0 760.0" stroke="#FFE6A7" stroke-width="1" opacity="0.2"/>
<text x="1140.0" y="790.0" font-size="16" text-anchor="middle" fill="#FFE6A7" opacity="1.0" font-weight="400" font-family="Red Hat Mono, ui-monospace, monospace">1.00</text>
<path d="M220.0 760.0L1140.0 760.0" stroke="#FFE6A7" stroke-width="2" opacity="1.0"/>
<path d="M220.0 260.0L220.0 760.0" stroke="#FFE6A7" stroke-width="2" opacity="1.0"/>
<text x="680.0" y="822.0" font-size="18" text-anchor="middle" fill="#FFE6A7" opacity="1.0" font-weight="400">recall</text>
<text transform="translate(196 260) rotate(-90)" font-size="18" text-anchor="end" fill="#FFE6A7">queries per second, log scale</text>
<path d="M404.0 300.0L680.0 360.0L864.0 440.0L1002.0 540.0L1071.0 635.0L1107.8 720.0" stroke="#FFE6A7" stroke-width="3" opacity="1.0"/>
<circle cx="404.0" cy="300.0" r="6" fill="#FFE6A7" opacity="1.0"/>
<text x="404.0" y="284.0" font-size="15" text-anchor="middle" fill="#FFE6A7" opacity="1.0" font-weight="400" font-family="Red Hat Mono, ui-monospace, monospace">16</text>
<circle cx="680.0" cy="360.0" r="6" fill="#FFE6A7" opacity="1.0"/>
<text x="680.0" y="344.0" font-size="15" text-anchor="middle" fill="#FFE6A7" opacity="1.0" font-weight="400" font-family="Red Hat Mono, ui-monospace, monospace">32</text>
<circle cx="864.0" cy="440.0" r="6" fill="#FFE6A7" opacity="1.0"/>
<text x="864.0" y="424.0" font-size="15" text-anchor="middle" fill="#FFE6A7" opacity="1.0" font-weight="400" font-family="Red Hat Mono, ui-monospace, monospace">64</text>
<circle cx="1002.0" cy="540.0" r="6" fill="#FFE6A7" opacity="1.0"/>
<text x="988.0" y="546.0" font-size="15" text-anchor="end" fill="#FFE6A7" opacity="1.0" font-weight="400" font-family="Red Hat Mono, ui-monospace, monospace">128</text>
<circle cx="1071.0" cy="635.0" r="6" fill="#FFE6A7" opacity="1.0"/>
<text x="1057.0" y="641.0" font-size="15" text-anchor="end" fill="#FFE6A7" opacity="1.0" font-weight="400" font-family="Red Hat Mono, ui-monospace, monospace">256</text>
<circle cx="1107.8" cy="720.0" r="6" fill="#FFE6A7" opacity="1.0"/>
<text x="1093.8" y="726.0" font-size="15" text-anchor="end" fill="#FFE6A7" opacity="1.0" font-weight="400" font-family="Red Hat Mono, ui-monospace, monospace">512</text>
<circle cx="404.0" cy="300.0" r="16" fill="none" stroke="#FFE6A7" stroke-width="2" opacity="1.0" stroke-dasharray="3 4"/>
<text x="1123.8" y="746.0" font-size="19" text-anchor="start" fill="#FFE6A7" opacity="1.0" font-weight="400">engine A</text>
<path d="M680.0 410.0L864.0 450.0L979.0 495.0L1048.0 535.0L1094.0 575.0L1121.6 625.0" stroke="#FFE6A7" stroke-width="3" opacity="1.0" stroke-dasharray="6 5"/>
<circle cx="680.0" cy="410.0" r="6" fill="none" stroke="#FFE6A7" stroke-width="2.5" opacity="1.0"/>
<circle cx="864.0" cy="450.0" r="6" fill="none" stroke="#FFE6A7" stroke-width="2.5" opacity="1.0"/>
<circle cx="979.0" cy="495.0" r="6" fill="none" stroke="#FFE6A7" stroke-width="2.5" opacity="1.0"/>
<circle cx="1048.0" cy="535.0" r="6" fill="none" stroke="#FFE6A7" stroke-width="2.5" opacity="1.0"/>
<circle cx="1094.0" cy="575.0" r="6" fill="none" stroke="#FFE6A7" stroke-width="2.5" opacity="1.0"/>
<circle cx="1121.6" cy="625.0" r="6" fill="none" stroke="#FFE6A7" stroke-width="2.5" opacity="1.0"/>
<circle cx="979.0" cy="495.0" r="16" fill="none" stroke="#FFE6A7" stroke-width="2" opacity="1.0" stroke-dasharray="3 4"/>
<text x="1137.6" y="651.0" font-size="19" text-anchor="start" fill="#FFE6A7" opacity="1.0" font-weight="400">engine B</text>
<path d="M1094.0 250.0L1094.0 760.0" stroke="#FFE6A7" stroke-width="2.5" opacity="1.0" stroke-dasharray="8 6"/>
<text x="1104.0" y="264.0" font-size="18" text-anchor="start" fill="#FFE6A7" opacity="1.0" font-weight="400">matched recall</text>
<text x="430.0" y="278.0" font-size="16" text-anchor="start" fill="#FFE6A7" opacity="1.0" font-weight="400">A at its default</text>
<text x="955.0" y="535.0" font-size="16" text-anchor="end" fill="#FFE6A7" opacity="1.0" font-weight="400">B at its default</text>
<text x="1250.0" y="290.0" font-size="18" text-anchor="start" fill="#FFE6A7" opacity="1.0" font-weight="400">Defaults land each engine</text>
<text x="1250.0" y="320.0" font-size="18" text-anchor="start" fill="#FFE6A7" opacity="1.0" font-weight="400">on a different point of its</text>
<text x="1250.0" y="350.0" font-size="18" text-anchor="start" fill="#FFE6A7" opacity="1.0" font-weight="400">curve, so comparing them</text>
<text x="1250.0" y="380.0" font-size="18" text-anchor="start" fill="#FFE6A7" opacity="1.0" font-weight="400">pits accuracy against speed.</text>
<text x="1250.0" y="410.0" font-size="18" text-anchor="start" fill="#FFE6A7" opacity="1.0" font-weight="400"></text>
<text x="1250.0" y="440.0" font-size="18" text-anchor="start" fill="#FFE6A7" opacity="1.0" font-weight="400">Sweeping --expansion-search</text>
<text x="1250.0" y="470.0" font-size="18" text-anchor="start" fill="#FFE6A7" opacity="1.0" font-weight="400">walks a curve; A's points</text>
<text x="1250.0" y="500.0" font-size="18" text-anchor="start" fill="#FFE6A7" opacity="1.0" font-weight="400">carry its values.</text>
<text x="1250.0" y="530.0" font-size="18" text-anchor="start" fill="#FFE6A7" opacity="1.0" font-weight="400"></text>
<text x="1250.0" y="560.0" font-size="18" text-anchor="start" fill="#FFE6A7" opacity="1.0" font-weight="400">At defaults A looks faster;</text>
<text x="1250.0" y="590.0" font-size="18" text-anchor="start" fill="#FFE6A7" opacity="1.0" font-weight="400">at the same 0.99 recall,</text>
<text x="1250.0" y="620.0" font-size="18" text-anchor="start" fill="#FFE6A7" opacity="1.0" font-weight="400">B answers more queries.</text>
<path d="M70 838H1530" stroke="#FFE6A7" stroke-width="1.5" opacity="0.6"/>
<text x="70" y="880" font-size="18" fill="#FFE6A7">Solid: engine A. Dashed: engine B. Dashed rings: each engine's default setting. Schematic curves, not measurements.</text>
</g>
</svg>
