name: CPU Checks
on: [push, pull_request]
jobs:
  check:
    name: Check ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Native and Server Backends
            features: usearch-backend,redis-backend,qdrant-backend,weaviate-backend,turso-backend,surrealdb-backend,generate,perf-counters
          - name: Static FAISS
            features: faiss-static
          - name: LanceDB and Downloads
            features: lancedb-backend,download
    steps:
      - name: Check Out Repository
        uses: actions/checkout@v4
      - name: Install BLAS, LAPACK, OpenMP and Protobuf
        run: sudo apt-get update && sudo apt-get install -y libblas-dev liblapack-dev libomp-dev protobuf-compiler
      - name: Install Rust 1.100 with Rustfmt and Clippy
        run: rustup toolchain install beta-2026-10-18 --profile minimal --component rustfmt,clippy
      - name: Check Formatting
        run: cargo fmt --all -- --check
      - name: Lint ${{ matrix.name }}
        run: cargo clippy --locked --no-default-features --features '${{ matrix.features }}' --all-targets -- -D warnings
      - name: Test ${{ matrix.name }}
        run: cargo test --locked --no-default-features --features '${{ matrix.features }}' --all-targets
