name: CUDA Checks
on: workflow_dispatch
jobs:
  check:
    name: Check cuVS Backend on CUDA Worker
    runs-on: [self-hosted, linux, x64, cuda]
    steps:
      - name: Check Out Repository
        uses: actions/checkout@v4
      - name: Install Rust 1.100 with Rustfmt and Clippy
        run: rustup toolchain install beta-2026-10-18 --profile minimal --component rustfmt,clippy
      - name: Lint cuVS Backend
        run: cargo clippy --locked --no-default-features --features cuvs-backend --all-targets -- -D warnings
      - name: Test cuVS Backend
        run: cargo test --locked --no-default-features --features cuvs-backend --all-targets
